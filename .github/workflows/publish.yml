# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish

on:
  push:
    branches: [ "release" ]

jobs:
  publish:

    permissions:
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore src
      - name: Pack Saxxon.Foundations.Sdl3
        run: dotnet pack src/Saxxon.Foundations.Sdl3 --no-restore
      - name: Pack Saxxon.Foundations.Sdl3.Game
        run: dotnet pack src/Saxxon.Foundations.Sdl3.Game --no-restore
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        run: dotnet nuget push **/bin/Release/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
